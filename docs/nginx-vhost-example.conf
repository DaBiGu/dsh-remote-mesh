# A dedicated vhost for the mesh relay: mesh.example.com
#
# Why a subdomain instead of reusing shop.example.com: the managed block that
# `deploy-relay.mjs` inserts lives under /__dsh-mesh/... , and keeping the whole
# relay on its own name means nothing you already serve can collide with it
# (no /__dsh-mesh on the steam site, no shared /healthz, no shared rate limits).
#
# Three steps, in this order:
#
#   1. DNS:  mesh.example.com  A  198.51.100.10
#      On Cloudflare that record must be DNS-only (grey cloud). An orange cloud
#      proxies WebSockets on paid plans only, and it would terminate TLS in
#      front of the relay, so keep it grey.
#
#   2. Certificate: the wildcard *.example.com already on this server covers
#      mesh.example.com, so issuing a new certificate is optional. Either reuse the
#      wildcard paths below, or add mesh.example.com to Certify The Web and let it
#      bind this vhost for you.
#
#   3. Insert the relay block:
#        node tools\deploy-relay.mjs plan  --domain mesh.example.com
#        node tools\deploy-relay.mjs apply --domain mesh.example.com
#
# ---------------------------------------------------------------------------
# 80 -> 443: keep the ACME path reachable so a renewal can still answer, then
# redirect everything else.
server {
    listen      80;
    server_name mesh.example.com;

    # Certify The Web writes its HTTP-01 challenges under a webroot; if you use
    # DNS-01 (the usual choice for a wildcard) this location is simply unused.
    location /.well-known/acme-challenge/ {
        root C:/Certify/Assets/acme-webroot;   # <-- your webroot, or delete this block
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# The TLS vhost the relay is inserted into. `plan` finds it by server_name and
# refuses to touch anything without an ssl_certificate, which is deliberate.
server {
    listen      443 ssl;
    server_name mesh.example.com;

    # ── IMPORTANT: this must be the FULL CHAIN, not the bare leaf ─────────────
    # Measured on this very server: nginx was serving one certificate (the leaf),
    # so browsers and curl reached the site fine — they fetch the missing
    # intermediate over AIA — while Node refused with
    #   UNABLE_TO_VERIFY_LEAF_SIGNATURE / unable to verify the first certificate.
    # The plugin's wss:// client IS Node, so a leaf-only file breaks the relay
    # even though the website looks healthy.
    #   check it:  node tools\deploy-relay.mjs chain --domain mesh.example.com
    #   want:      "certificates  2 sent by the server" and "node trust  OK"
    ssl_certificate     C:/Certify/Assets/example.com/fullchain.pem;   # <-- your path
    ssl_certificate_key C:/Certify/Assets/example.com/key.pem;         # <-- your path
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Nothing else is served on this name. HTTP/2 is optional: `http2 on;` works
    # on nginx 1.25.1+, and on older builds use `listen 443 ssl http2;` instead —
    # the relay does not need it either way.
    location / {
        return 404;
    }
}
