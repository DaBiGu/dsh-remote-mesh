# nginx snippet for the dsh-remote-mesh relay.
#
# Put this server block (or merge the `location`) into the nginx that already
# serves your domain, then point every machine's `relay.url` at the wss:// form
# of the location. Certify The Web keeps managing the certificate for you.
#
# The relay itself listens on plain HTTP on loopback; nginx terminates TLS and
# forwards the WebSocket upgrade. Nothing below this point can read the mesh
# traffic: every payload is sealed with the cluster key, which never leaves the
# machines you enrolled.

# `map` is only legal at the http{} level. If you already have a
# `$connection_upgrade` map in your nginx.conf, delete this block and reuse that
# one instead of declaring a duplicate name.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name mesh.example.com;

    # Certify The Web manages these two paths for the certificate it issued.
    ssl_certificate     C:/Certify/Assets/mesh.example.com/mesh.example.com-chain.pem;
    ssl_certificate_key C:/Certify/Assets/mesh.example.com/mesh.example.com-key.pem;

    # A dedicated subdomain is recommended: the relay then lives entirely
    # outside the paths your other services use.
    location /__dsh-mesh/relay {
        # The trailing slash makes nginx strip the prefix, so the relay sees "/".
        proxy_pass          http://127.0.0.1:8787/;

        proxy_http_version  1.1;
        # These two lines are what turn the request into a WebSocket.
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection $connection_upgrade;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;

        # A mesh link is idle most of the time and is kept warm by a ping every
        # 25s, so the read timeout has to be far above the ping interval.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Streaming both ways, so nginx must not collect the response first.
        proxy_buffering     off;
        proxy_request_buffering off;

        # The relay speaks its own binary framing; gzip would only burn CPU.
        gzip                off;
    }

    # A plain health check, handy for confirming the deployment. It lives under
    # the relay's own prefix on purpose: an exact `location = /healthz` here
    # would change how this vhost answers `/healthz` for your other services.
    location = /__dsh-mesh/relay/healthz {
        proxy_pass http://127.0.0.1:8787/healthz;
        proxy_set_header Host $host;
    }
}
