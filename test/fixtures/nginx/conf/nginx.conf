# A realistic nginx for Windows configuration, shaped like the machine this
# plugin is deployed against: one plain HTTP redirect vhost and one TLS vhost,
# a second unrelated site, and a path that contains a brace inside a comment.

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen       443 ssl;
        server_name  localhost;

        ssl_certificate     C:/Certify/Assets/localhost-chain.pem;
        ssl_certificate_key C:/Certify/Assets/localhost-key.pem;

        # a stray closing brace in a comment used to break naive brace counting }
        location / {
            root   html;
            index  index.html;
        }
    }

    server {
        listen       443 ssl;
        server_name  shop.example.com;
        ssl_certificate     C:/Certify/Assets/steam-chain.pem;
        ssl_certificate_key C:/Certify/Assets/steam-key.pem;

        location / {
            proxy_pass http://127.0.0.1:8080;
        }
    }
}
